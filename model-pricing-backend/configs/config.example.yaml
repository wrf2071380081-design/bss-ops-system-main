# 配置文件模板：复制为 config.yaml 后按本机环境修改
# cp configs/config.example.yaml configs/config.yaml

server:
  host: 0.0.0.0
  port: 8080
  mode: release        # debug | release
  timeout: 30s
  allow_origins:
    - http://localhost:5173
    - http://localhost:3000

db:
  host: 127.0.0.1
  port: 5433
  user: app
  password: ""
  dbname: model_bss
  sslmode: disable
  timezone: Asia/Shanghai
  max_open: 30
  max_idle: 5
  max_lifetime: 1h
  slow_threshold: 200ms

# Redis 仅用于短信验证码 + 登录失败限流；enable=false 时降级为进程内缓存
redis:
  enable: false
  addr: 127.0.0.1:6379
  password: ""
  db: 0

auth:
  token_secret: please_change_me
  access_ttl: 8h
  refresh_ttl: 168h
  max_login_fail: 5
  lock_duration: 15m

log:
  level: info
  format: json        # console | json
  file: logs/app.log

# 在线接口调试页（Swagger UI）：GET /swagger/index.html
# 默认开启（见 internal/infra/config/env.go 的 SetDefault），这里显式写出来便于生产关闭。
#  production 建议 false —— 该页会列出全部接口与参数，属内部调试资产。
docs:
  enable: true

# ============================================================
# 模块开关（重构收敛用）
#   true  = 对外保留；false = 路由返回 404（只隐藏入口，代码与表都还在）。
#   ⚠️ 缺整段 features 不等于「全开」：viper 把 9 个开关都取零值 = 全部关闭，
#      46 条模块路由会静默 404（2026-10-30 验收踩过：线上配置没有这一段）。
#      启动日志会打印 module features 生效清单，全关时额外打一条 warn。
#   可用环境变量覆盖：MODEL_BSS_FEATURES_COST=true 等。
#   改这里要跟着看前端：页面还在、接口被拦 = 点进去只能看到报错。
# ============================================================
features:
  # 以下三项按原型 v0.19 演示口径打开：官方报价同步页要读变更单（approval）、
  # 采集批次与暂存价（legacy_price_sync），客户报价页要发起特价（special_price）。
  approval: true                 # 审批/变更单/model-application 决策
  legacy_price_sync: true        # 旧官方价同步（官方报价同步页：批次与暂存价）
  special_price: true            # 客户特价审批/刷新
  # 以下模块原型用不到，保持关闭；对应前端页面已不在菜单里（meta.menu=false）。
  cost: false                    # 成本四因子/基线/机会/对比/锁主供
  pricing_policy: false          # 定价策略
  price_upconduction: false      # 涨价传导
  supplier_quote_approval: false # 供应商报价的审批/异常/追溯动作（页面仍可从工作台待办跳入）
  finance_legacy: false          # 汇率/账户/汇率锁
  # 客户自助门户：平台不提供客户登录。下线三处一致（账号 SUSPENDED / 本开关 false /
  # 前端摘掉 /customer 路由），详见 scripts/suspend_customer_portal_20261030.sql 头部说明。
  customer_portal: false

# ============================================================
# 测试平台（open-api v1）—— B 线对接
#   base_url 填站点根（形如 http://host:port/open-api），客户端会自动补 /api/v1。
#   token 是实名调用方 token（cons- 前缀），属密钥：只写在 configs/config.yaml
#   或环境变量 MODEL_BSS_TEST_PLATFORM_TOKEN 里，本文件只留占位。
#   base_url 或 token 为空 → 出站关闭（报告读取仍然可用）。
# ============================================================
test_platform:
  internal_base_url: ""   # 平台自有模型接口，与供应商测试URL分开
  internal_api_key: ""    # 平台自有额度Key；只在本机/部署配置填写，不提交真实值
  enable: true
  base_url: ""            # 例：http://10.19.218.33:18080/open-api
  token: ""               # 例：cons-xxxx（不要提交真实值）
  webhook_secret: ""      # 回调验签密钥；为空则不注册 /api/open/test-callback（只靠轮询）
  timeout: 30s
  poll_interval: 15s      # 轮询间隔（Q11：轮询为主、回调为辅）
  poll_limit: 50          # 单轮最多处理多少个未终态任务
  report_dir: "bin/test-reports"   # 报告本地副本目录（Q12）
  # 凭据策略（2026-10-26 与 A 侧对齐）：测试 Key 原样入库，不再加密/解密。

# ============================================================
# 上传目录（2026-10-27，供应商账户设置用）
#   企业证明等门户上传文件落在这里，库里只存相对路径。
#   目录不存在会自动创建；生产建议挂到独立卷上。
# ============================================================
uploads:
  dir: "var/uploads"
